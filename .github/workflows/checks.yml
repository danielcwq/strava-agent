name: Checks
on:
  pull_request:
  push:
    branches: [context-revamp]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.5.31
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
